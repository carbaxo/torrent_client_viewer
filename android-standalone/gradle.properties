# Clave de TMDB (v3, solo lectura de catálogos). VACÍA A PROPÓSITO: el
# repositorio es público, y una clave aquí queda expuesta para siempre (también en
# el historial, aunque se borre después). En CI llega desde el secreto TMDB_KEY; en
# local, ponla en tu ~/.gradle/gradle.properties (fuera del repo, Gradle la lee
# sola) o pásala al compilar:
#     ./gradlew assembleDebug -PTMDB_KEY=tu_clave
# Sin ella la app funciona, pero sin catálogos. Se saca gratis en
# https://www.themoviedb.org/settings/api
TMDB_KEY=
# ID de cliente web de Google (para el login con Google / sync).
GOOGLE_WEB_CLIENT_ID=457371422941-h4mrcnr3905llcpp3k6l39bn2h5na9uq.apps.googleusercontent.com
