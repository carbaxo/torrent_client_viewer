org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Clave TMDB (v3, solo lectura de catálogos). Repo privado; puedes rotarla en
# https://www.themoviedb.org/settings/api. En CI se puede sobreescribir con
# -PTMDB_KEY o el secreto TMDB_KEY. Sin ella, la app funciona pero sin catálogos.
TMDB_KEY=CLAVE_ROTADA_FUERA_DEL_REPO
# ID de cliente web de Google (para el login con Google / sync). Se rellena
# tras registrar la app en Firebase (ver README). Vacío = sin login Google.
GOOGLE_WEB_CLIENT_ID=
