name: Deploy frontend to GitHub Pages

# Publica SOLO la carpeta public/ (el frontend estático) en GitHub Pages.
# El backend Node se despliega aparte (Render/Fly.io). Recuerda poner la URL
# del backend en public/config.js (window.TCV_API_BASE) antes de publicar.

on:
  push:
    branches: [main, master, claude/torrent-downloader-streaming-cqjddi]
    paths:
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; cancela los anteriores en curso
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
