name: Build Android APK

# Compila la app Android autónoma (android-standalone/) y publica el APK
# como artefacto y como Release descargable.

on:
  push:
    branches: [main, master, claude/torrent-downloader-streaming-cqjddi, claude/native-app-vs-webapp-8guu5l]
    paths:
      - 'android-standalone/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-standalone
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TorrentBox.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrentBox-apk
          path: android-standalone/TorrentBox.apk

      # Borra el release/tag anterior para que la FECHA en GitHub se refresque
      # (al reutilizar el mismo tag, GitHub congela la fecha de publicación).
      - name: Delete previous release so the date refreshes
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete android-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true

      - name: Publish APK to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: TorrentBox (Android APK)
          make_latest: true
          body: |
            APK de TorrentBox: streaming y descargas vía Real-Debrid, en el móvil y en la Android TV.
            Requiere una cuenta de Real-Debrid (se configura en Ajustes).
            Descarga `TorrentBox.apk`, actívalo en Ajustes → "Instalar apps desconocidas" e instálalo.
            Build ${{ github.run_number }} — commit ${{ github.sha }}
          files: android-standalone/TorrentBox.apk
