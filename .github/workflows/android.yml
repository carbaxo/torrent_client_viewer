name: Build Android APK

# Compila la app Android autónoma (android-standalone/) y publica el APK
# como artefacto y como Release descargable.

on:
  push:
    # Una sola rama publica el APK en la Release android-latest: si compilan
    # varias, la última en terminar sobrescribe el APK de las demás.
    branches: [main, master, claude/torrent-downloader-streaming-cqjddi]
    paths:
      - 'android-standalone/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

# Un solo build publicando a la vez. Hace falta porque el paso de publicar BORRA
# y RECREA el tag android-latest: con dos runs a la vez (tres pushes seguidos en
# un minuto, por ejemplo), uno crea la Release y el otro se la borra debajo, y el
# primero acaba con "error listing assets: Not Found -> Too many retries".
# Y de paso no se gastan minutos compilando commits que ya han quedado atrás:
# cancel-in-progress deja solo el último, que es el que importa.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-standalone
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # La clave de firma NO esta en el repositorio (es publico). Viene del
      # secreto KEYSTORE_B64 (el .keystore en base64). Sin ese secreto se compila
      # igual, pero con la clave de depuracion por defecto de Android: el APK
      # servira para instalar de cero y NO para actualizar los ya instalados.
      - name: Restaurar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > vizplay.keystore
            echo "Clave de firma restaurada ($(stat -c%s vizplay.keystore) bytes)."
          else
            echo "::warning::Sin KEYSTORE_B64: el APK se firmara con la clave de depuracion y NO actualizara las instalaciones existentes."
          fi

      - name: Build debug APK
        env:
          VIZPLAY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VIZPLAY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VIZPLAY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew assembleDebug --stacktrace --no-daemon
          -PTMDB_KEY="${{ secrets.TMDB_KEY }}"

      # El alias TorrentBox.apk sigue publicandose porque las versiones <=74
      # buscaban ese nombre EXACTO; sin el se quedarian sin auto-actualizacion y
      # habria que reinstalar a mano en cada dispositivo. Desde la 75 la app
      # acepta cualquier .apk, asi que en cuanto todo este en 75+ se puede quitar.
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VizPlay.apk
          cp app/build/outputs/apk/debug/app-debug.apk TorrentBox.apk

      # El artefacto se sube SOLO a mano (workflow_dispatch). La cuota de
      # almacenamiento de artefactos de la cuenta se ha llenado ("Artifact storage
      # quota has been hit") y no tiene sentido gastarla: el APK se descarga de la
      # Release, que es el mismo fichero y NO consume esa cuota. Sigue con
      # continue-on-error para que, aun lleno, nunca impida publicar.
      - name: Upload APK as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VizPlay-apk
          path: android-standalone/VizPlay.apk
          retention-days: 3

      # Borra el release/tag anterior para que la FECHA en GitHub se refresque
      # (al reutilizar el mismo tag, GitHub congela la fecha de publicación).
      - name: Delete previous release so the date refreshes
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete android-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true

      - name: Publish APK to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: VizPlay (Android APK)
          make_latest: true
          body: |
            APK de VizPlay: streaming y descargas vía Real-Debrid, en el móvil y en la Android TV.
            Requiere una cuenta de Real-Debrid (se configura en Ajustes).
            Descarga `VizPlay.apk`, actívalo en Ajustes → "Instalar apps desconocidas" e instálalo.
            (`TorrentBox.apk` es el mismo fichero, para que se actualicen las versiones antiguas.)
            Build ${{ github.run_number }} — commit ${{ github.sha }}
          files: |
            android-standalone/VizPlay.apk
            android-standalone/TorrentBox.apk
