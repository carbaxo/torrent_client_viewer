name: Build Android APK

# Compila la app Android autónoma (android-standalone/) y publica el APK
# como artefacto y como Release descargable.

on:
  push:
    # Una sola rama publica el APK en la Release android-latest: si compilan
    # varias, la última en terminar sobrescribe el APK de las demás.
    branches: [main, master, claude/torrent-downloader-streaming-cqjddi]
    paths:
      - 'android-standalone/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-standalone
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # Se publican los DOS nombres a proposito: las versiones ya instaladas
      # buscaban el asset llamado exactamente "TorrentBox.apk", asi que si solo
      # se publicara el nombre nuevo se quedarian sin auto-actualizacion y habria
      # que reinstalar a mano en cada dispositivo. Cuando todo este en 75+ se
      # puede quitar el alias.
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VillazPlay.apk
          cp app/build/outputs/apk/debug/app-debug.apk TorrentBox.apk

      # El artefacto es solo una comodidad: si la cuenta se queda sin cuota de
      # almacenamiento de artefactos, NO debe impedir publicar la Release (que
      # es de donde se descarga el APK y no consume esa cuota).
      - name: Upload APK as workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VillazPlay-apk
          path: android-standalone/VillazPlay.apk
          retention-days: 7

      # Borra el release/tag anterior para que la FECHA en GitHub se refresque
      # (al reutilizar el mismo tag, GitHub congela la fecha de publicación).
      - name: Delete previous release so the date refreshes
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete android-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true

      - name: Publish APK to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: VillazPlay (Android APK)
          make_latest: true
          body: |
            APK de VillazPlay: streaming y descargas vía Real-Debrid, en el móvil y en la Android TV.
            Requiere una cuenta de Real-Debrid (se configura en Ajustes).
            Descarga `VillazPlay.apk`, actívalo en Ajustes → "Instalar apps desconocidas" e instálalo.
            (`TorrentBox.apk` es el mismo fichero, para que se actualicen las versiones antiguas.)
            Build ${{ github.run_number }} — commit ${{ github.sha }}
          files: |
            android-standalone/VillazPlay.apk
            android-standalone/TorrentBox.apk
