name: Build Android APK

# Compila la app Android autónoma (android-standalone/) y publica el APK
# como artefacto y como Release descargable.

on:
  push:
    branches: [main, master, claude/torrent-downloader-streaming-cqjddi]
    paths:
      - 'android-standalone/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-standalone
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TorrentBox.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrentBox-apk
          path: android-standalone/TorrentBox.apk

      - name: Publish APK to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: TorrentBox (Android APK)
          body: |
            APK autónomo de TorrentBox: descarga y reproduce torrents en el propio móvil.
            Descarga `TorrentBox.apk`, actívalo en Ajustes → "Instalar apps desconocidas" e instálalo.
            Build ${{ github.run_number }} — commit ${{ github.sha }}
          files: android-standalone/TorrentBox.apk
