# Configuración de Fly.io para el BACKEND Node (modo Real-Debrid).
#
# Pasos:
#   1) fly launch --no-deploy        (o edita 'app' con un nombre único tuyo)
#   2) fly volumes create data --size 1 --region mad
#   3) fly secrets set OMDB_API_KEY=... TMDB_API_KEY=... SESSION_SECRET=<algo largo> \
#        ALLOWED_ORIGINS=https://carbaxo.github.io
#   4) fly deploy
#
# Los SECRETOS (API keys, SESSION_SECRET) NO van aquí: usa `fly secrets set`.

app = "torrent-client-viewer"       # <-- cámbialo por un nombre único
primary_region = "mad"              # Madrid; ajusta a tu zona

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATA_DIR = "/data"                 # usuarios, sesiones, perfiles e historial
  DOWNLOAD_DIR = "/data/downloads"   # solo si usas "Descargar" (archivo en el servidor)
  TMDB_REGION = "ES"
  SECURE_COOKIE = "true"             # Fly sirve por HTTPS

# Volumen persistente montado en /data (sobrevive a reinicios/redeploys).
# En modo Real-Debrid guarda poco: cuentas, perfiles, favoritos e historial.
# Solo necesitas espacio de verdad si usas "Descargar" a disco del servidor.
[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # El streaming va directo del CDN de Real-Debrid al navegador, así que la
  # máquina puede dormirse sin cortar la reproducción: solo se despierta para
  # buscar y para resolver magnets con RD. Ponlo a 1 si usas "Descargar" a
  # disco y quieres que continúe sin nadie conectado.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"                   # sin motor BitTorrent ni ffmpeg basta con poco
